# Tienda de referencia Copayapu (WordPress + WooCommerce) - entorno local de desarrollo
# Iniciar:  docker compose up -d        Abrir: http://localhost:8088   Admin: http://localhost:8088/wp-admin
# Detener:  docker compose stop         Borrar todo (incluye datos): docker compose down -v
name: copayapu
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: copayapu
      MYSQL_USER: copayapu
      MYSQL_PASSWORD: copayapu_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: copayapu
      WORDPRESS_DB_PASSWORD: copayapu_local
      WORDPRESS_DB_NAME: copayapu
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html

  cli:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on: [db, wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: copayapu
      WORDPRESS_DB_PASSWORD: copayapu_local
      WORDPRESS_DB_NAME: copayapu
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./assets:/assets:ro
      - ./setup:/setup:ro
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
