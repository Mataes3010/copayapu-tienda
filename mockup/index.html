<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo navegable de la tienda eCommerce de Copayapu, Sabores de Atacama (negocio ficticio, proyecto académico).">
<title>Copayapu Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: tienda de una columna centrada (máx. 1180 px) bajo una barra de prototipo oscura; tarjetas solo donde separan objetos (producto, resumen, paneles). Identidad deliberadamente de un solo tema (marca clara). */
:root{
  --bg:#FFFFFF; --surface:#F4F5EF; --surface-2:#E8EBDD; --line:#D8DCCD;
  --ink:#1E2619; --muted:#5A6351;
  --olive:#46591F; --olive-d:#2F3D14; --olive-l:#E6EBD6;
  --flor:#B4245C; --flor-d:#8E1A48; --flor-l:#FAE5EE;
  --cobre:#A55D27; --cobre-l:#F5E6D8;
  --ok:#2B7647; --ok-l:#E2F1E7; --warn:#9A6210; --warn-l:#FBF0DC;
  --proto:#191D22; --proto-fg:#E8EBEF; --proto-mut:#A2AAB4;
  --rf:#2552B8; --rf-l:#E3EBFB;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--proto)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rf);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Barra del prototipo */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--proto);color:var(--proto-fg)}
.proto .wrap{display:flex;align-items:center;gap:16px;padding-block:8px}
.proto-name{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--proto-mut);white-space:nowrap}
.proto-nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.proto-nav a{color:var(--proto-fg);text-decoration:none;font-size:13px;padding:5px 10px;border-radius:999px;white-space:nowrap}
.proto-nav a:hover{background:#2A3038}
.proto-nav a[aria-current="page"]{background:var(--proto-fg);color:var(--proto)}
.proto-nav a span{color:var(--proto-mut);margin-right:4px}
.proto-nav a[aria-current="page"] span{color:#5A6270}
.proto label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--proto-mut);white-space:nowrap;cursor:pointer}
.proto input{accent-color:var(--rf)}

/* Etiqueta de requisito */
.rf{display:inline-block;font:600 10.5px/1 var(--f-body);letter-spacing:.03em;color:var(--rf);background:var(--rf-l);border:1px solid #BFD0F4;border-radius:4px;padding:3px 5px;vertical-align:middle;margin-left:6px;white-space:nowrap}
body.no-rf .rf{display:none}

/* Encabezado de la tienda */
.announce{background:var(--olive-d);color:#EEF2E2;font-size:13px}
.announce .wrap{padding-block:7px;text-align:center}
.site{border-bottom:1px solid var(--line);background:var(--bg)}
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo b{display:block;font-family:var(--f-display);font-size:23px;font-weight:800;letter-spacing:-.01em;color:var(--olive-d)}
.logo small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:-2px}
.search{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-width:0}
.search input{border:0;background:transparent;padding:10px 0;flex:1;min-width:0;outline:none}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px rgba(30,38,25,.12);padding:6px;z-index:20}
.suggest a{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:8px;text-decoration:none;font-size:14px}
.suggest a:hover{background:var(--surface)}
.suggest small{color:var(--muted)}
.suggest .sg-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.hicons{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:600}
.hicons a{text-decoration:none;display:flex;align-items:center;gap:6px}
.count{background:var(--flor);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px}
.cats{border-top:1px solid var(--line)}
.cats .wrap{display:flex;gap:22px;overflow-x:auto;padding-block:10px;font-size:14px;font-weight:500}
.cats a{text-decoration:none;white-space:nowrap;color:var(--muted)}
.cats a:hover,.cats a.on{color:var(--olive-d)}
.cats a.hl{color:var(--flor);font-weight:700}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14.5px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--olive);color:#fff}
.btn-p:hover{background:var(--olive-d)}
.btn-f{background:var(--flor);color:#fff}
.btn-f:hover{background:var(--flor-d)}
.btn-o{border-color:var(--olive);color:var(--olive-d);background:var(--bg)}
.btn-g{border-color:var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.btn-w{background:var(--ok);color:#fff}
.btn-block{width:100%}

/* Secciones */
main{display:block}
.sec{padding-block:36px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.sec-h p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);font-weight:700}
.crumb{font-size:13px;color:var(--muted);padding-block:16px 0}
.crumb a{text-decoration:none}

/* Héroe */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding-block:34px 10px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero h1{font-size:44px;font-weight:800;letter-spacing:-.02em;color:var(--olive-d)}
.hero p{font-size:17px;color:var(--muted);margin:0;max-width:56ch}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero-facts{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.hero-facts b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.camp{position:relative;border-radius:16px;background:var(--flor);color:#fff;padding:26px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:300px}
.camp h2{font-size:30px;max-width:13ch}
.camp p{margin:8px 0 0;max-width:30ch;color:#FCE3EC}
.camp .code{display:inline-block;background:#fff;color:var(--flor-d);font-weight:800;letter-spacing:.06em;border-radius:6px;padding:4px 10px;margin-top:10px}
.camp svg{position:absolute;right:-30px;bottom:-30px;width:250px;opacity:.95}
.camp>div,.camp .btn{position:relative;z-index:1}
.camp .btn{align-self:flex-start;background:#fff;color:var(--flor-d)}

/* Categorías */
.catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cat{text-decoration:none;display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px}
.cat .ph{border-radius:12px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.cat small{color:var(--muted);font-weight:500}

/* Tarjetas de producto */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.card{display:flex;flex-direction:column;min-width:0}
.card-img{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.card-img svg,.cat svg,.thumb svg{display:block;width:100%;height:100%}
.badge{position:absolute;top:10px;left:10px;background:var(--bg);color:var(--ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.badge.adult{left:auto;right:10px;background:var(--ink);color:#fff}
.badge.low{color:var(--warn)}
.card-body{display:flex;flex-direction:column;gap:3px;padding-top:10px;flex:1}
.origin{font-size:12px;color:var(--olive);font-weight:600;letter-spacing:.02em}
.card-title{font-weight:600;text-decoration:none;line-height:1.3}
.stars{font-size:13px;color:var(--cobre);font-weight:600}
.stars span{color:var(--muted);font-weight:400}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-size:17px;font-variant-numeric:tabular-nums}
.add{border:1.5px solid var(--olive);background:var(--bg);color:var(--olive-d);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;cursor:pointer}
.add:hover{background:var(--olive);color:#fff}
.why{font-size:12px;color:var(--muted);background:var(--surface);border-radius:6px;padding:4px 8px;margin-top:8px}
.reco{background:var(--olive-l);border-radius:16px;padding:22px}
.reco .sec-h{margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:999px;padding:4px 11px;background:var(--bg);border:1px solid var(--line)}
.linkish{font-size:13px;color:var(--olive-d);font-weight:600}

/* Social */
.ugc{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ugc figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/5;max-width:100%}
.ugc figure svg{width:100%;height:100%;display:block}
.ugc figcaption{position:absolute;inset:auto 0 0 0;padding:8px;background:linear-gradient(transparent,rgba(20,24,16,.72));color:#fff;font-size:12px;display:flex;justify-content:space-between;align-items:end;gap:6px}
.ugc .tag{background:#fff;color:var(--ink);border-radius:999px;padding:2px 8px;font-weight:700;font-size:11px;white-space:nowrap}
.social-cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;padding:14px 18px;border:1px dashed var(--flor);border-radius:12px;background:var(--flor-l)}

/* Confianza */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:20px}
.trust div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.trust b{display:block;color:var(--ink);font-size:14px}
.ico{flex:none;width:34px;height:34px;border-radius:50%;background:var(--olive-l);display:grid;place-items:center;color:var(--olive-d)}
.news{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;background:var(--surface);border-radius:16px;padding:24px}
.news form{display:flex;flex-direction:column;gap:10px}
.news .row{display:flex;gap:8px}
.field{border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--bg);flex:1;min-width:0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--olive)}

/* Pie */
footer{background:var(--olive-d);color:#DCE3CB;margin-top:40px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding-block:32px;font-size:14px}
footer h4{font-family:var(--f-display);color:#fff;margin:0 0 8px;font-size:15px}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:5px}
footer a{text-decoration:none}
.legal{border-top:1px solid #4A5A2C}
.legal .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px;font-size:12.5px;color:#B8C3A0;grid-template-columns:none}
.wa{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;background:var(--ok);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(20,60,35,.3)}

/* Catálogo */
.cat-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-block:18px 10px}
.filters{display:flex;flex-direction:column;gap:18px;font-size:14px}
.filters h3{font-size:15px;margin-bottom:8px;font-family:var(--f-body);font-weight:700}
.filters label{display:flex;justify-content:space-between;gap:8px;padding:3px 0;cursor:pointer}
.filters label span{display:flex;gap:8px;align-items:center}
.filters input[type=checkbox]{accent-color:var(--olive);width:16px;height:16px}
.filters small{color:var(--muted)}
.range{display:flex;gap:8px;align-items:center}
.range input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)}
.active-f{display:flex;gap:6px;flex-wrap:wrap}
.active-f .chip{background:var(--olive-l);border-color:transparent}

/* Ficha */
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;padding-block:18px 8px}
.gallery{display:grid;grid-template-columns:72px 1fr;gap:12px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumb{border-radius:10px;overflow:hidden;aspect-ratio:1/1;border:2px solid transparent}
.thumb.on{border-color:var(--olive)}
.main-img{border-radius:16px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.main-img svg{width:100%;height:100%;display:block}
.pinfo{display:flex;flex-direction:column;gap:14px}
.pinfo h1{font-size:32px;letter-spacing:-.01em}
.pprice{display:flex;align-items:baseline;gap:12px}
.pprice b{font-family:var(--f-display);font-size:32px}
.pprice small{color:var(--muted)}
.stock{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ok);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.buy{display:flex;gap:10px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{border:0;background:transparent;width:38px;height:42px;font-size:18px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:700}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ship-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.ship-row small{color:var(--muted)}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.share a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;text-decoration:none;font-weight:600}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;margin:0}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:600}
.bundle{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:var(--surface);border-radius:16px;padding:20px}
.bundle-items{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bundle-items .bi{width:96px;text-align:center;font-size:12px}
.bundle-items .bi div{border-radius:10px;overflow:hidden;aspect-ratio:1/1;margin-bottom:4px}
.bundle-items .plus{font-size:22px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs span{padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs span.on{color:var(--olive-d);border-bottom:2.5px solid var(--olive)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rv-sum{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.rv-big{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1}
.bars{display:grid;gap:4px;font-size:12.5px}
.bar{display:grid;grid-template-columns:28px 1fr 36px;gap:8px;align-items:center}
.bar i{display:block;height:7px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--cobre);border-radius:4px}
.review{border-top:1px solid var(--line);padding-block:14px;font-size:14px}
.review header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.verified{font-size:12px;color:var(--ok);font-weight:700}
.rv-photos{display:flex;gap:8px;margin-top:8px}
.rv-photos div{width:64px;height:64px;border-radius:8px;overflow:hidden}
.rv-photos svg{width:100%;height:100%}

/* Carrito */
.cart-layout{display:grid;grid-template-columns:1fr 360px;gap:28px;padding-block:18px 8px;align-items:start}
.citem{display:grid;grid-template-columns:84px 1fr auto auto;gap:16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.citem .ph{width:84px;height:84px;border-radius:10px;overflow:hidden}
.citem .ph svg{width:100%;height:100%}
.citem small{color:var(--muted)}
.note18{display:inline-block;margin-top:4px;font-size:12px;background:var(--warn-l);color:var(--warn);border-radius:6px;padding:2px 8px;font-weight:600}
.progress{background:var(--surface);border-radius:12px;padding:14px 16px;font-size:14px}
.progress i{display:block;height:8px;background:var(--surface-2);border-radius:5px;margin-top:8px;overflow:hidden}
.progress i b{display:block;height:100%;background:var(--olive);border-radius:5px}
.summary{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;position:sticky;top:64px}
.summary h2{font-size:20px}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.srow.total{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:10px}
.pays{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.pays span{border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini .card-title{font-size:13.5px}

/* Checkout */
.steps{display:flex;gap:0;margin:18px 0 22px;counter-reset:st;flex-wrap:wrap}
.step{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);position:relative;padding-right:12px}
.step i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;border:2px solid var(--line);background:var(--bg)}
.step.done{color:var(--olive-d)} .step.done i{background:var(--olive);border-color:var(--olive);color:#fff}
.step.now{color:var(--ink)} .step.now i{border-color:var(--flor);color:var(--flor)}
.step::after{content:"";flex:1;height:2px;background:var(--line)}
.step:last-child::after{display:none}
.step.done::after{background:var(--olive)}
.co-sec{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.co-sec h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.co-sec.done{background:var(--surface)}
.co-sec.done p{margin:0;font-size:14px;color:var(--muted)}
.co-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:14px;cursor:pointer}
.opt.on{border-color:var(--olive);background:var(--olive-l)}
.opt input{accent-color:var(--olive)}
.opt small{display:block;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fgrid .in{border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:13.5px}
.seg span{padding:7px 14px;font-weight:600}
.seg span.on{background:var(--olive);color:#fff}
.secure{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}

.ok-hero{display:flex;gap:18px;align-items:center;padding-block:30px 10px}
.ok-badge{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;flex:none}
.ok-hero h1{font-size:32px}
.ok-hero p{margin:6px 0 0;color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:6px}
.track div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:12.5px;color:var(--muted);position:relative}
.track div::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}
.track div:first-child::before{display:none}
.track i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;position:relative;z-index:1}
.track .d i{background:var(--olive);border-color:var(--olive);color:#fff}
.track .d::before,.track .n::before{background:var(--olive)}
.track .n i{border-color:var(--flor);color:var(--flor)}
.track .d,.track .n{color:var(--ink);font-weight:600}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-grid .box b{display:block;font-size:14px}
.info-grid .box span{font-size:13.5px;color:var(--muted)}
.refer{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--flor-l);border-radius:16px;padding:20px 22px}
.refer h3{font-size:20px;color:var(--flor-d)}

.acct{display:grid;grid-template-columns:230px 1fr;gap:28px;padding-block:22px 8px;align-items:start}
.side{display:flex;flex-direction:column;gap:4px;font-size:14.5px}

.avatar{width:44px;height:44px;border-radius:50%;background:var(--cobre-l);color:var(--cobre);display:grid;place-items:center;font-weight:800}

.side a{text-decoration:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600}

.order-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.order-h b{font-size:15px}
.order-h small{color:var(--muted);font-size:13px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.st.prep{background:var(--warn-l);color:var(--warn)}
.st.ok{background:var(--ok-l);color:var(--ok)}
.order-items{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.order-items .oi{width:48px;height:48px;border-radius:8px;overflow:hidden}
.order-items .oi svg{width:100%;height:100%}
.order-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn-s{padding:7px 14px;font-size:13px}

.replenish .ph{width:64px;height:64px;border-radius:10px;overflow:hidden}
.replenish small{display:block;color:var(--muted);font-size:13px}

.tog small{display:block;color:var(--muted);font-size:12.5px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--surface-2);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}

.rule{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:13.5px}
.rule:last-child{border-bottom:0}
.rule small{display:block;color:var(--muted);font-size:12px}
.model{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.model dt{color:var(--muted)} .model dd{margin:0;font-weight:600}

.flow-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px}
.flow-wrap svg{display:block;min-width:960px;width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:70}

@media (max-width:980px){

V.flujo=()=>{
  const n=(x,y,w,h,t,s,href,tags='')=>`<a href="#${href}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${s==='in'?'#F4F5EF':'#FFFFFF'}" stroke="${s==='in'?'#A8AF98':'#46591F'}" stroke-width="${s==='in'?1.2:2}"/><text x="${x+w/2}" y="${y+h/2+(tags?-4:5)}" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1E2619">${t}</text>${tags?`<text x="${x+w/2}" y="${y+h/2+15}" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="11.5" fill="#5A6351">${tags}</text>`:''}</a>`;
  const e=(x,y,w,h,t)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#F4F5EF" stroke="#A8AF98"/><text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-family="Figtree,Segoe UI,sans-serif" font-size="13.5" font-weight="600" fill="#1E2619">${t}</text>`;
  const ar=(d,c='#2F3D14',dash='',m='a')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''} marker-end="url(#${m})"/>`;
  const lbl=(x,y,t,c='#5A6351')=>`<text x="${x}" y="${y}" font-family="Figtree,Segoe UI,sans-serif" font-size="12" fill="${c}" text-anchor="middle">${t}</text>`;
  return `${header()}<main class="wrap sec">
  <div class="sec-h"><div><span class="eyebrow">Mapa del prototipo</span><h1 style="font-size:30px">Flujo de navegación y compra</h1><p>Haz clic en una pantalla para abrirla. Las etiquetas indican dónde aparecen recomendaciones (R) y elementos sociales (S).</p></div></div>
  <div class="flow-wrap"><svg viewBox="0 0 1120 600" role="img" aria-label="Diagrama del flujo de navegación">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2F3D14"/></marker>
      <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B4245C"/></marker>
      <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2552B8"/></marker>
    </defs>

/* ---------- Enrutador ---------- */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function render(){
  const id=(location.hash||'#inicio').slice(1);
  const key=V[id]?id:'inicio';
  document.getElementById('app').innerHTML=V[key]();
  document.getElementById('pnav').innerHTML=SCREENS.map(([k,t],i)=>`<a href="#${k}" ${k===key?'aria-current="page"':''}><span>${i<9?i+1:'↳'}</span>${t}</a>`).join('');
  document.querySelector('.wa').hidden=(key==='admin');
  window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const add=ev.target.closest('[data-add]');
  if(add){ev.preventDefault();toast('Agregaste '+byId[add.dataset.add].n+' al carrito');return}
  const c=ev.target.closest('[data-cat]');
  if(c){state.cat=c.dataset.cat}
  if(ev.target.closest('[data-clear]')){state.cat=null;if(location.hash==='#catalogo'){ev.preventDefault();render()}}
  const sw=ev.target.closest('.sw');
  if(sw&&!sw.disabled){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')==='true'?'false':'true')}
});
document.addEventListener('change',ev=>{
  const f=ev.target.closest('[data-fcat]');
  if(f){state.cat=f.checked?f.dataset.fcat:null;render()}
});
document.getElementById('rftoggle').addEventListener('change',e=>document.body.classList.toggle('no-rf',!e.target.checked));
window.addEventListener('hashchange',render);
render();
</script>
